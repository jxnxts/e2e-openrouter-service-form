<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento público · Demonstração</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #183029; background: #f2f5ef; }
  body { margin: 0; padding: 32px 20px; }
  main { max-width: 560px; margin: auto; background: white; border: 1px solid #ccd8ce; border-radius: 12px; padding: 28px; }
  h1 { font-size: 1.8rem; margin: 8px 0 16px; } p { line-height: 1.5; }
  .notice { border-left: 4px solid #9e6d00; background: #fff6d8; padding: 12px; }
  label { display: block; font-weight: 650; margin: 18px 0 6px; }
  input, textarea { box-sizing: border-box; font: inherit; width: 100%; border: 1px solid #788b81; border-radius: 4px; padding: 10px; }
  button { margin-top: 20px; background: #195d45; color: white; font: inherit; font-weight: 650; padding: 12px 18px; border: 0; border-radius: 5px; cursor: pointer; }
  :focus-visible { outline: 3px solid #007ba8; outline-offset: 3px; }
  [role="alert"] { color: #922a20; } [role="status"] { background: #e8f4ec; padding: 0 12px; }
</style>
<main>
  <p>Município de Exemplo · Ambiente de demonstração</p>
  <h1>Solicitar atendimento</h1>
  <p class="notice">Demonstração fictícia. Use apenas dados sintéticos. Nenhum pedido é enviado a um órgão público.</p>
  <form novalidate>
    <label for="name">Nome fictício</label>
    <input id="name" autocomplete="off" maxlength="80">
    <label for="request">Descrição do pedido fictício</label>
    <textarea id="request" rows="3" maxlength="500"></textarea>
    <button type="submit">Gerar protocolo fictício</button>
  </form>
  <p role="alert" hidden></p>
  <div role="status"></div>
</main>
<script>
  const form = document.querySelector('form');
  const alertBox = document.querySelector('[role="alert"]');
  const status = document.querySelector('[role="status"]');
  form.addEventListener('submit', event => {
    event.preventDefault();
    alertBox.hidden = true;
    status.replaceChildren();
    const name = document.querySelector('#name').value.trim();
    const request = document.querySelector('#request').value.trim();
    if (!name || !request) {
      alertBox.textContent = 'Preencha o nome fictício e a descrição do pedido.';
      alertBox.hidden = false;
      return;
    }
    const confirmation = document.createElement('p');
    confirmation.textContent = `Protocolo fictício DEMO-0001 gerado para ${name}. Pedido: ${request}. Nenhum envio real foi realizado.`;
    status.append(confirmation);
  });
</script>
</html>
